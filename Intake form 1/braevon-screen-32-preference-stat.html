       from the padding and the gaps rather than the type: the client raised
       these tags to 13px the same day. Measured after: 4.6px to spare. */
    .ck-inc, .ck-save { padding: 0 7px; }
    .ck-what { gap: 6px; }
    .ck-amt { gap: 6px; }
    /* And 13px on the struck figure, which took the last of it. That is the one
       number in the row explicitly not being charged — it is there to be crossed
       out — so it is what gives way when something else has to fit. 1.5px of
       slack was inside the margin a real device's rasteriser can move. */
    .ck-amt s { font-size: 13px; }
    .ck-what { gap: 8px; }
    /* Size matches desktop since the 32 came down to 26; only the leading is
       tightened here. */
    .ck-line.total .ck-amt b { line-height: 1; }
    /* **Spaced apart, not huddled** (2026-08-19, checked on the client's phone):
       the score mark and the customer count are the bar's two halves, and
       centring them left ~50px of empty bar outside each and 14px between. The
       14 stays as the wrap gap; `space-between` is what puts the air where it
       belongs while the two share a row. Below 361 they do not — see the rule
       further down, which centres them again once the bar is two rows. */
    .ck-trust {
      flex-wrap: wrap; justify-content: space-between;
      gap: 10px 14px; padding: 14px; min-height: 0;
    }
    /* Once the bar wraps, the count and its label are a stack of their own on the
       second row, and they were left-aligned to each other — "175,000+" is
       narrower than "happy customers", so it hung off to the left of a block that
       was itself centred. Centre the pair on a phone; **desktop stays
       left-aligned**, which is what the PDF draws and where the two sit at the end
       of a single row rather than in a stack. Asked for on 2026-08-17. */
    .ck-trust-n { text-align: center; }

    /* Stays a row on a phone: Edit belongs on the right, opposite the details
       it edits. It stacked here until 2026-08-14, which dropped the button
       under the email and left the panel tall and lopsided. It fits — at 320px
       the longest line is the address at ~120px and the button ~72px, inside
       the 252px the padding leaves. */
    .ck-readback { gap: 12px; padding: 16px; }
    .ck-rb-name { font-size: 17px; }
    .ck-rb-line { font-size: 14px; }
    .ck-rb-edit { font-size: 14px; min-height: 40px; padding: 0 16px; }
    .ck-hipaa b { font-size: 17px; }
    .ck-hipaa span { font-size: 15px; }

    .ck-form { padding: 16px; }
    .ck-pay { padding: 24px 16px; }
    .ck-pay .ck-fields { column-gap: 12px; row-gap: 12px; }
    .ck-pay .ck-fields + .consent { margin-top: 26px; }
    .ck .cta { margin-top: 18px; }
    .ck .badges { margin-top: 24px; }
    .ck-hsa { font-size: 19px; gap: 6px; margin: 22px 0 24px; }
    .ck-hsa svg { width: 32px; height: 32px; }

    .ck-press { margin-top: 26px; }
    .ck-press-lead { font-size: 14px; margin-bottom: 18px; }
    .ck-tests { grid-template-columns: 1fr; gap: 14px; margin-top: 24px; }
    .ck-tests .tcard { padding: 20px; border-radius: 18px; }
    .ck-faq { padding: 22px 18px 18px; margin-top: 24px; }

    /* A phone has less height to give away, and the strip is nearer the thumb
       than the eye — this reads as deliberate room without pushing the headline
       under the fold. Down from 32px with the desktop tier, in the same two
       steps. */
    .step[data-no-mast] { padding-top: 12px; }

    /* ---- 35: the upsell on a phone ----
       Two things collapse and nothing else has to: the guarantee panel stacks
       its ring above its copy, and the sticky bar's pair goes side by side at
       equal width instead of one wide button with a chip beside it. Everything
       in between is the offer card, which is already a single column. */
    .up { padding-bottom: 88px; }
    .up-head { margin-bottom: 18px; }
    .up-eyebrow { font-size: 11.5px; letter-spacing: .12em; margin-bottom: 10px; }
    /* The page headline comes down harder than the ramp would: it is four lines
       at 375px even here, and 34px made it six. */
    .up-head h1 { font-size: 25px; margin-bottom: 12px; }
    .up-sub { font-size: 14px; }
    .up-offer { padding: 16px 14px 20px; }
    .up-tag { font-size: 13px; height: 28px; line-height: 28px; padding: 0 12px; }
    /* 96px wide, so ~139 tall. The copy column at 390px is the constraint here,
       not the render — the title wraps to two lines and the claim under it to
       three, so the row is already ~150px and the image sits inside that. */
    .up-prod { gap: 12px; padding-bottom: 20px; }
    .up-shot { flex: 0 0 96px; }
    .up-brand { font-size: 18px; }
    .up-prod-info h2 { font-size: 20px; }
    .up-prod-sub { font-size: 15px; margin-top: 8px; }
    .up-why { margin-top: 22px; }
    .up-why-h { font-size: 15px; margin-bottom: 14px; }
    .up-why li { font-size: 14px; gap: 9px; margin-bottom: 13px; }
    .up-why svg { width: 17px; height: 17px; }
    .up-bill { margin-top: 22px; padding: 14px 12px 16px; }
    .up-warn { font-size: 14px; margin-bottom: 14px; padding: 10px 14px; }
    .up-warn svg { width: 17px; height: 17px; }
    /* The pill wraps at this width — "Save $144" on one line and the rest under
       it — so it stops being a row and becomes a two-line block that still
       centres. */
    .up-hero-save { flex-wrap: wrap; gap: 6px; padding: 11px 14px; font-size: 14px; }
    .up-hero-save b { font-size: 23px; }
    .up-row { font-size: 15px; }
    .up-row s, .up-amt { font-size: 16px; }
    .up-price { padding: 12px 14px; gap: 10px; }
    /* The phone tier takes a smaller step than the desktop one. "Quarterly VIP
       pricing" is the widest thing in this column and the 27px figure beside it
       leaves roughly 170px, so 16px would wrap the label onto a second line. */
    .up-price-l b { font-size: 15px; }
    .up-price-l > span { font-size: 13.5px; margin-top: 7px; }
    .up-price-r b { font-size: 27px; }
    .up-price-r s { font-size: 13px; }
    .up-includes { font-size: 13px; }
    .up-close { margin-top: 22px; }
    .up-close h3 { font-size: 18px; }
    .up-close p { font-size: 15px; }
    .up-close .up-lock { font-size: 15px; margin-top: 12px; }
    .up-terms { font-size: 14px; margin-top: 15px; }
    .up-bypass { font-size: 17px; margin-top: 17px; }
    .up-decline { font-size: 14px; margin-top: 15px; }
    /* The reference's label names the quantity, which makes it long — at the
       inherited 17px it wrapped to two lines inside the button at 390px and took
       it to 73px tall. 15.5px holds "Upgrade to 36-Tablet Supply Now" and its
       arrow on one line inside a 330px button with room to spare. The sticky
       bar's button is unaffected; it carries the short label. */
    .up .up-offer .cta { font-size: 15.5px; }
    .up-testhead { margin: 32px 0 20px; }
    .up-testhead h2 { font-size: 27px; margin-bottom: 13px; }
    .up-testhead .up-eyebrow { margin-bottom: 14px; }
    .up-testhead p { font-size: 15px; }
    /* The stack and the centring moved to the base rule on 2026-08-31, when the
       client asked for them at every width. What is left here is what is
       genuinely this tier's: a tighter gap, less padding and a smaller radius. */
    .up-guar { gap: 16px; padding: 22px 18px; margin-top: 34px; border-radius: 18px; }
    .up-guar-mark { flex: 0 0 auto; width: 72px; height: 72px; }
    .up-guar-info h2 { font-size: 23px; }
    .up-guar-info p { font-size: 14px; }
    /* The desktop 160 does not fit beside the copy on a phone — the column
       would be 183px at 375 and the bullet list would set two words to a line.
       96 is where it was before the desktop bump, and it still clears the type
       beside it. */
    .ty-onset-mark { flex: 0 0 96px; height: 96px; }
    .up-bar { gap: 10px; padding: 12px; }
    /* Both buttons share the width. `min-width` from the desktop rule would
       force the pair past 375px and push the decline off-screen. */
    .up .up-bar .cta { flex: 1 1 0; min-width: 0; font-size: 14.5px; padding: 0 12px; }
    .up-bar-no { flex: 0 0 auto; padding: 0 16px; font-size: 12px; letter-spacing: .06em; }
  }

  /* ---- 33: the ingredient tiles on the narrowest phones ----
     The molecule names are one unbreakable word each and the tiles are half a
     phone wide, so the longest name sets the size. "APOmorphine" measures 90.9px
     at 13.5px against an 80px content box at 320px — it ran flush to the tile
     edge with no right padding at all. 11.5px brings it to 77.4px and back
     inside.

     It was already over at 13.5px when the word was "Apomorphine" (88.2px); the
     capitals the client asked for on 2026-08-17 added 2.7px and turned a
     marginal fit into a visible one.

     **360px, not the 720px phone block**: at 375 the box is 108px and the name
     fits at full size, so shrinking it there would cost legibility for nothing.
     Re-measure if a longer ingredient name is ever added — this is sized to the
     longest string, not picked for looks. */
  @media (max-width: 360px) {
    .ap-tile span { font-size: 11.5px; }
    /* The trust bar wraps at this width, and `space-between` on a row holding a
       single item is just `flex-start` — so the two halves would stack against
       the left edge. Centred is right once they are a stack. */
    .ck-trust { justify-content: center; }
  }

  /* ---- 35: holding the guarantee headline to two lines on a 320px phone ----
     The `<br>` in that headline (2026-08-31, the client's "2 lines for all
     desktop and phone version") fixes where it breaks but cannot make either
     half fit. At the 23px the 720 tier sets, the longer half — "The only thing
     you'll lose" — measures 261px on the real font, and the panel's column is
     `viewport - 68` (the page gutter plus the panel's own 18px either side).
     That runs out at 329px, so 23px holds on a 360 and a 375 and fails on a
     320, where the sentence became **four** lines rather than three: with the
     break stated, each half wraps on its own.

     21px, not 22. At 22 the longer half lands within 2px of the column, which
     is inside the rounding between this measurement and a real device's font
     rasterisation; 21 leaves 14px and is still the largest thing in the panel.
     **Anything that widens this half — a longer product name, a word added to
     the sentence — has to be re-measured here**, and the number to beat is the
     column, not the sentence.

     After the 360 block, not before it: same property, same specificity, so
     source order is what decides — the note at the top of this file. */
  @media (max-width: 340px) {
    .up-guar-info h2 { font-size: 21px; }
  }

  /* ---- 33: holding the plan row on one line down to 481px ----
     These two blocks sit **after** the 720px block on purpose: they set the same
     properties at the same specificity, so source order is what decides, exactly
     as the 1300-after-901 note at the top of this file describes.

     The budget, measured on the real font. A row of width W has
     `W - 20 (its own padding) - 21 (the ring) - 16 (two row gaps) - gap` of space
     for text, and the three longest strings cost 6.23 / 14.45 / 7.89 px of width
     per 1px of font size. `.ck-plans` is inset from the viewport by 62px, so
     W is about V - 62.

       V = 561 -> W 499 -> 434 available; 15/12/15 needs 385   fits
       V = 481 -> W 419 -> 352 available; 13/11/13 needs 343    fits, ~9px spare
       V = 375 -> W 313 -> 246 available; 13/11/13 needs 343    over by 97px

     So 481px is the real floor, and it is arithmetic rather than taste. */
  @media (max-width: 560px) {
    /* 6px on the row's two gaps rather than 8. Measured at the tightest point —
       481px with the 20-tablet string, which is the widest of the three — the
       note had exactly 0px of slack at 8px gaps. Working with no margin is how a
       font-metric difference on another machine turns into a truncated line, so
       the 4px comes out of the gaps rather than out of the type. */
    .ck-plan-row { gap: 6px; }
    .ck-plan-main { gap: 6px; }
    .ck-plan-main b { font-size: 13px; }
    .ck-plan-main small { font-size: 11px; }
    .ck-plan-meta { font-size: 13px; }
  }

  /* Below 481px the three items cannot share a line at any legible size — see
     the numbers above: 343px of text into 246px of room at 375px, and dropping
     the note to 8px to force it is not a design, it is a defect. The note goes
     back under the name here and the quantity keeps the right, which is what
     this screen did at every phone width until 2026-08-17.

     `b` and `small` carry their own `display: block`, which is what makes them
     stack once the container stops being a flex box; without it they fall back to
     inline and render "3 Month PlanBilled monthly for 3 months".

     **The way to buy this line back on a phone is shorter copy, not smaller
     type** — "Billed monthly" alone costs 6.5px per font px against the current
     14.45, which fits 375px comfortably. That is a copy decision, so it is the
     client's to make. */
  @media (max-width: 480px) {
    .ck-plan-main { display: block; }
    .ck-plan-main b { font-size: 15px; }
    /* The one-line guard has to come **off** here. Stacked, the note has only the
       column beside the quantity to sit in — about 120px at 375px — so the
       `nowrap` + ellipsis that protects the single-line layout would cut it to
       "Billed monthly. Cance...". Wrapping is the correct behaviour once it has
       its own row. */
    .ck-plan-main small {
      white-space: normal; overflow: visible; text-overflow: clip;
      font-size: 12px; margin-top: 4px;
    }
    .ck-plan-meta { font-size: 15px; }
  }

  /* No tablet block for these two screens, deliberately. `.ap` and `.ck` are a
     fixed 620px column at every width above the phone breakpoint, so a tablet
     sees exactly the desktop layout — the two-up tiles and testimonials are
     310px either side at 768px just as they are at 1440px. A min-width: 721px
     block here would change something that is not width-dependent. */

  /* ==========================================================================
     CORNERS
     One radius for the whole design — buttons, images, fields, options, panels.
     Deliberately not a pill: it should read as the same softness as an option
     row, so `--radius` is the single dial. `* { border-radius: 0 }` at the top
     of this file stays as the baseline, and everything that should round is
     listed here explicitly, so nothing picks up a radius by accident.
     ========================================================================== */
  .cta,
  .back-btn,
  .opt,
  .tile,
  .field select,
  .field input,
  .field textarea,
  .bp .cell,
  .loader li,
  .note,
  .checkcard,
  .statcard,
  .tcard,
  .consent,
  .cs-card,
  .promo-pop-inner,
  .feat,
  .media-cap,
  .benefits .pin,
  .dq-reason,
  .split .media img,
  .split .media > svg,
  .track,
  .track .fill { border-radius: var(--radius); }

  /* The grouped list is one card, so only its outer corners round — the rows
     inside must stay square or they pull away from the container's edge. */
  .opts.grouped { border-radius: var(--radius); overflow: hidden; }
  .opts.grouped .opt { border-radius: 0; }

  /* The two selection marks keep their own geometry: the radio stays a circle
     and the checkbox stays visibly square, because that contrast is what tells
     single-select from multi-select. The full radius on a 19px box would round
     it almost to a circle and lose the distinction. */
  .consent .box, .opt.checkbox .ring { border-radius: 3px; }

  /* The map is a bare silhouette on the page, not a panel — rounding its box
     would clip Florida and Maine for no visual gain. */
  .usmap { border-radius: 0; }
</style>

  body.frames .frame-grid > div, body.frames .frame { width: auto; max-width: none; border: 0; background: var(--page); }

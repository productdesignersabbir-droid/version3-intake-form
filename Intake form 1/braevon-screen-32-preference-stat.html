     gap. They are the PDF's: 11 under the stars, 5 under the title, 14 over the
     initials. `.stars` carries an 11px bottom margin globally; it is zeroed here
     or it stacks on the title's own. */
  .ck-tests .tcard .stars { gap: 2px; margin-bottom: 0; }
  .ck-tests .tcard .stars svg { width: 12px; height: 12px; }
  .ck-tests .tcard h3 { font-size: 17px; font-weight: 700; margin: 11px 0 0; color: #FFFFFF; }
  .ck-tests .tcard p { font-size: 15px; line-height: 23px; color: var(--ck-dim); margin: 5px 0 0; }
  .ck-tests .tcard .who { font-size: 13px; font-weight: 700; color: var(--ck-dimmer); margin-top: 14px; }

  .ck-faq { padding: 24px 28px 25px; margin-top: 30px; }
  .ck-faqh { margin: 0 0 33px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--ck-ink); line-height: 1.2; }
  .ck-faq-lead { font-size: 15px; line-height: 1.4; color: var(--ck-muted); margin: 0 0 5px; }
  /* A rule above every question and one under the last, so the list reads as a
     stack of rows rather than as separated blocks. 51px to the next rule, which
     is the padding plus the leading — do not swap the explicit line-height for
     `normal`, it is what makes the row measure. */
  .ck-faq .acc { border-top: 1px solid var(--ck-hair); }
  .ck-faq .acc:last-child { border-bottom: 1px solid var(--ck-hair); }
  .ck-faq .acc-head { padding: 15px 2px; font-size: 15px; line-height: 1.33; font-weight: 600; color: var(--ck-body); }
  .ck-faq .acc-head svg { width: 16px; height: 16px; color: var(--ck-muted); }
  /* The global `.acc-body` is 13px on `--muted`, which is the only thing on
     this screen that was still off the ramp once everything else was on it. */
  .ck-faq .acc-body { padding: 0 2px 16px; font-size: 14px; line-height: 1.65; color: var(--ck-muted); }
  .ck-faq .acc-body b { color: var(--ck-ink); }

  /* ==========================================================================
     35 — the post-checkout upsell
     Built 2026-08-26 from the competitor screenshots the client sent (MEDVi's
     one-time upgrade offer), in Braevon's own language.

     **This screen wears `.ck`.** Its wrapper is `class="ck up"`, so the whole
     `--ck-*` ramp above — ink, body, muted, faint, hair, and the checkout's
     deeper green — reaches it untouched, along with `.ck-card`, `.ck-tests`,
     `.ck .acc` and `.ck .cta`. Everything below states only what the checkout
     has no equivalent for. If something here needs a colour or a size, take it
     from that ramp or widen it; a literal grey in a `.up-` rule is the thing
     these two screens were tidied up to stop.

     **This screen is green, and it is the only one that is** (client,
     2026-08-31): "change the CTA button color to green, currently it looks
     danger". It used to be the one place that departed from the reference on
     purpose — every CTA in the four screenshots is green and this kept orange,
     on the house-rule-2 split where green is what is saved and orange is what
     to press. The client overruled that here and the reference wins: 35 is an
     offer screen, not a form, and a full-width orange button under a warning
     line was reading as a stop rather than as the thing to press.

     **The split still holds everywhere else.** 33, 34 and 36 keep the orange
     CTA, so this is a screen-scoped override and not a move of `--accent`.
     Every rule below is written `.up ...` for that reason — do not "tidy" one
     of them up into the global `.cta` block, which would repaint the whole
     flow. The greens are the checkout's own `--ck-green` ramp, not new ones.

     **The two colours swapped jobs twice in one day, and the second swap is
     the one that stands.** The morning's pass put emphasis in orange and took
     the pending pill and the warning line green. That evening the client
     reversed all six at once — "make all the orange of the upsell page to
     green", with the pill and the warning line named separately as the things
     that should go orange. The four that came back to green:

       `.up-head h1 b`      the headline's "Save $159!"     `--ck-green`
       `.up-why svg`        the three "Why Men Upgrade" ticks `--ck-green`
       `.up-testhead h2 b`  "raving about us"               `--ck-green`
       `.up-guar-mark`      the 96px guarantee ring         `--ck-green-ink`

     and the two that went orange:

       `.up-pending`        "Wait! Your order is pending"   `--warn-wash/ink`
       `.up-warn`           "You're currently only saving"  `--accent-ink`

     **So the screen is now green for everything and orange for warnings only.**
     Green does emphasis, money and the button; orange appears twice, both times
     on something telling the reader they are about to lose out. That is the
     opposite of what this block described for most of 2026-08-31, and it is
     simpler: there is no longer a rule to learn about which green means what.

     **The ring is the one thing not on the screen's plain green.** It sits on
     `--ck-green-wash` and `--ck-green` on that ground is 4.5:1 — one family at
     two strengths, which is exactly the "reads as decoration" failure that got
     it moved to orange in the morning. `--ck-green-ink` is 8.2:1 there. Do not
     flatten it back for consistency; the note on the rule has the numbers.

     **Change one of these six and you are changing the split**, so check which
     of the two lists a thing belongs in before you move it.

     **And there is a third, of exactly one thing.** `.up-warn` — "You're
     currently only saving $99" — is the one line on the screen that is neither
     an offer nor a figure but a warning. It is **`--accent-ink` orange on no
     plate**, and it shares that orange with `.up-pending` at the top of the
     screen and with nothing else: on 2026-08-31 the client moved every other
     orange mark here to green and these two the other way, so **orange is now
     the screen's warning colour and green is its emphasis colour.** The line
     has been seven things and **the note on that rule lists all seven with
     their contrast figures** — read it before touching this.
     ========================================================================== */

  /* Clears the sticky bar, which is `position: fixed` and so takes no space of
     its own. 96px is the bar's 54px button plus its 14px of padding either side,
     plus a 14px breath so the FAQ's last rule does not sit under the blur. */
  .up { padding-bottom: 96px; }

  /* ---- 35: the green CTA (client, 2026-08-31) ----
     `--ck-green` is #15803D, which is the shade the checkout already picked for
     carrying white type: 5.02:1 against white, where the reference's own
     #16A34A is 3.30:1 and fails AA at the 16px the sticky bar's button sets.
     The button is the largest piece of green on the screen, so this is the one
     place that figure has to hold. Do not "brighten" it to the reference green.

     Hover is `--ck-green-ink` (#14532D), the ramp's deep green, which is the
     same one-step-darker move `--accent-hover` makes for the orange. The focus
     ring goes with it: at `--accent-hover` it was an orange outline around a
     green button, which is the leftover that makes a colour change look
     half-finished.

     `.up` in front of each, and `.up .up-bar .cta:hover` rather than a bare
     `.cta:hover`, so this cannot reach the checkout on 34 or the thank-you on
     36 — both of those wear `.ck` too. */
  .up .cta { background: var(--ck-green); }
  .up .cta:hover { background: var(--ck-green-ink); }
  .up .cta:focus-visible { outline-color: var(--ck-green-ink); }

  /* ---- 35: the offer, on the page ground ---- */
  /* ---- 35: the surfaces ----
     **The white is not #FFFFFF here** (client, 2026-08-27): "make the entire
     white background little less white and closer to the actual background".
     #F8F9FA is 30% of the way from white to `--page` (#E7EAED) — enough that the
     card stops cutting a hard white hole in the ground, not so far that it stops
     reading as a card sitting on it.

     **One token, redefined on the screen**, rather than a background on each
     card. `--surface` is what `.ck-card` and `.tcard` both paint with, so the
     offer card and the four testimonial cards move together and cannot end up
     two different whites. Scoped to `.up`: the rest of the flow keeps the pure
     white, and widening this to the whole flow means moving `--surface` in
     `:root`, not adding a second override here.

     What deliberately does not follow: `.up-price` keeps `--neutral-tint`
     (#F2F3F5) and `.up-bill` keeps its transparent ground inside a `--ck-hair`
     rule. Both are meant to read as inset against the card, and they still do —
     the price box stays one step darker than the surface behind it. */
  .up { --surface: #F8F9FA; }

  /* ---- 35: the pending strip ----
     The reference's yellow "Wait! Your order is pending 10:53", at the client's
     ask on 2026-08-27. It is the first thing on the screen because the masthead
     and the dark plan bar both came off at the same word, so this is what the
     page opens on.

     **A pill, not a full-width bar.** The bar it replaces spanned the window,
     which is what a piece of chrome above a masthead does; there is no masthead
     here any more and a band across an empty page ground reads as a leftover
     header. The reference sets it as a pill and so does this.

     **`--accent-ink` type on a `--warn-wash` yellow pill**, built from the
     client's reference image (2026-09-01) with "keep the text orange" alongside
     it. Orange on yellow — two hues, which is what the reference shows and what
     makes this different from every fill this pill has worn before.

     The fills, in order: #FDF3D3 amber, the checkout's green wash,
     `--accent-soft`, nothing at all for one commit that morning, and now this.
     The bare state came from reading a green circle drawn around `.up-warn` as
     "match that treatment"; the reference image that followed said it was the
     ground he wanted changed, not removed.

     **This overturns the "do not put a yellow back here" rule that stood on
     this rule for a day**, and the rule was not silly — the flow had just spent
     four passes getting yellow *off* `.up-warn`, and two yellow alarms on one
     screen would have been two things competing to be the alarm. What makes
     this safe is that there is only one: `.up-warn` is bare orange type and is
     staying that way. **If a fill is ever proposed for `.up-warn` again, this
     pill is the reason to say no** — the screen has one yellow and it is here.

     4.87:1 at 13.5px/600, so it clears AA with a little room. That is below the
     5.6:1 the bare state measured and above the 4.79:1 of the orange wash
     before it; the yellow is a lighter ground than either, which is what keeps
     an orange this saturated legible on it.

     The triangle rides `currentColor` and so stays orange with the type. The
     reference draws it as a filled yellow warning glyph, which is an emoji
     standing in for an icon — a yellow mark on this ground would disappear.

     It is still a notice and still reads as one: the alarm triangle and the
     running clock say so, and now the ground does too.

     `font-variant-numeric: tabular-nums` on the clock, as `.plan-timer b` has:
     without it the strip's width twitches every second as the digits change. */
  .up-pending {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: max-content; max-width: 100%; margin: 0 auto 20px;
    padding: 9px 18px; border-radius: 999px;
    background: var(--warn-wash); color: var(--accent-ink);
    /* 13.5/600, down from 14.5/700 (client, 2026-08-27). It is a notice above
       the headline, not a heading of its own, and at the old weight it was
       competing with the eyebrow directly under it. */
    font-size: 13.5px; font-weight: 600; text-align: center;
  }
  .up-pending svg { flex: 0 0 auto; width: 17px; height: 17px; }
  /* The sentence and its figure are one flex item. A bare `<b>` beside the text
     would be a second, and the row's 8px gap would open up inside the sentence —
     the same trap `.up-warn` and the sticky bar's label are wrapped against. */
  .up-pending span { display: inline; }
  .up-pending b {
    /* 4px, not 7 — there is a real space in the markup before this, so that
       a screen reader does not read "pending15:00", and it carries the rest. */
    /* 700 against the sentence's 600 — the figure still leads, by the same one
       step it had at the old weights. */
    margin-left: 4px; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  /* Above the card rather than inside it, which is the checkout's own habit for
     section titles and what makes this read as a page rather than as one more
     card in a stack. */
  .up-head { text-align: center; margin: 0 0 24px; }
  .up-eyebrow {
    margin: 0 0 12px; font-size: 13px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ck-muted);
  }
  /* 34px. Off the `.ck` ramp's 26px top step on purpose and the only thing on
     either screen that is: this is a page headline with nothing beside it, not a
     card heading sharing a row with a product render, so it takes the room the
     ramp's ceiling exists to deny those. `--fs-title` at 42px is the other
     direction and too much — it would dwarf the card it is arguing for. */
  .up-head h1 {
    margin: 0 0 16px; font-size: 34px; font-weight: 800; letter-spacing: -0.025em;
    line-height: 1.16; color: var(--ck-ink);
    /* Both headlines on this screen run three lines on a phone and two on a
       laptop, and the browser's greedy wrap left a two-word orphan on the last
       one at several widths. `balance` evens the lines out instead. It is
       ignored where unsupported, which costs nothing — the fallback is the wrap
       we would have had anyway — and the `&nbsp;` pairs in the markup still do
       the work it cannot: they say which words must never part, which is a
       different job from making the lines the same length. */
    text-wrap: balance;
  }
  /* The saving, and nothing else on the line. **Green since 2026-08-31**,
     later the same day the client marked it orange — the reversal came with
     "make all the orange of the upsell page to green", and it took the tick
     icons, the testimonial headline and the guarantee ring with it. It is still
     house rule 2's "one emphasis per marketing screen"; only the colour of that
     emphasis moved. `--ck-green` is the CTA's own green, so the word now
     matches the button it argues for, and at 5.02:1 on the page ground it is
     the safer of the two — the orange it replaces was 3.4:1 and cleared only
     because this is 34px bold. */
  .up-head h1 b { color: var(--ck-green); font-weight: 800; }
  /* `pretty` rather than `balance`: this is running copy, not a headline, so the
     job is only to stop a single word being left alone on the last line if the
     measure ever changes under it. It does not reduce the line count — the copy
     is what keeps this to two lines, and there is a note on it in steps.py. */
  .up-sub {
    margin: 0; font-size: 15px; line-height: 1.55; color: var(--ck-body);
    text-wrap: pretty;
  }

  /* ---- 35: the offer card ---- */
  .up-offer { padding: 20px 20px 24px; }
  .up-tagrow { display: flex; justify-content: flex-end; margin: 0 0 4px; }
  /* The `.ck-inc` pill one size up. Not `.ck-inc` itself: that is a 22px tag
     riding beside a bill row, and this is the card's own headline claim. */
  .up-tag {
    background: var(--ck-green-wash); color: var(--ck-green-ink); border-radius: 999px;
    padding: 0 14px; height: 30px; line-height: 30px; font-size: 14px; font-weight: 700;
  }

  /* ---- the card's vertical rhythm ----
     **28px between blocks, up from 20** (2026-08-26: "now they look very busy").
     The card holds four blocks in a row now — product, benefits, tier choice,
     arithmetic — where it held two when 20px was set, and every one of them has
     had its type raised a step since. Same spacing under taller content reads as
     crowding, so the gaps went up with it.

     The four numbers below are deliberately not identical. The product block
     closes on a rule, which does some of the separating itself, so it takes 24
     rather than 28; the tier list is the one thing on the card the patient has
     to act on, so it gets the most air in front of it. Change them as a set, not
     one at a time. */
  .up-prod {
    display: flex; align-items: center; gap: 16px;
    padding: 0 0 24px; border-bottom: 1px solid var(--ck-hair);
  }
  /* **One image from 2026-08-26**, the client's own three-tablet render. This
     slot used to hold three copies of screen 34's single tablet, overlapped with
     negative margins to fake a stack; the real asset arrived and the fake went
     with it.

     A width with `height: auto`, not a square: `product-quarterly.png` is 352x512
     and portrait, where the fake was wide and short. 148px sets the height at
     ~215, which is taller than the copy beside it — that is the render being
     given its due, and the row centres the shorter column against it. No shadow:
     it is painted into the file's own alpha. */
  .up-shot { flex: 0 0 148px; display: flex; align-items: center; justify-content: center; }
  .up-shot img { display: block; width: 100%; height: auto; }
  .up-prod-info { flex: 1 1 auto; min-width: 0; }
  /* 22px, up from 19 (2026-08-26, the client marked this line). It is the
     product's name and it was reading as a caption above the real title — the
     reference sets the two close in size, one line light and the line under it
     heavy, rather than a small line over a big one. 22 is on the `.ck` ramp
     (26/24/22/19/17/…) so this takes the next step up rather than a new size. */
  .up-brand { margin: 0; font-size: 22px; font-weight: 500; color: var(--ck-body); line-height: 1.25; }
  .up-brand b { font-weight: 800; color: var(--ck-ink); }
  .up-prod-info h2 {
    margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--ck-ink); line-height: 1.2;
  }
  /* **Upright, 16px, 500** &mdash; the client's call on 2026-08-26, replacing the
     14px italic this carried for a few hours. The italic came from the
     reference, where it is set as a whisper under the title; here it was reading
     as a caption rather than as the product's claim, and it is the only italic
     on either screen so it had nothing to belong to. Upright and a step up puts
     it with the copy it is actually part of. The `.up-lock` line further down is
     the screen's one italic now. */
  /* **`balance`, not `pretty`** (client, 2026-08-27): the sentence was breaking
     after "automated" and leaving "coverage." alone on the second line. `pretty`
     — which `.up-sub` up the page takes — only guards the last line against a
     single short word once the rest has been set, and one orphan out of two
     lines is exactly the case it does not catch. `balance` sets the whole block
     to even line lengths instead, which is what a two-line paragraph beside a
     product render needs.

     It is capped at a handful of lines by the spec, which is fine here: this
     slot holds one sentence and the copy note above says why. Browsers without
     it fall back to a normal greedy wrap — the orphan, i.e. what this looked
     like before, not something worse. */
  .up-prod-sub {
    margin: 10px 0 0; font-size: 16px; font-weight: 500; line-height: 1.45;
    color: var(--ck-muted); text-wrap: balance;
  }

  /* ---- 35: why men upgrade ---- */
  .up-why { margin: 26px 0 0; }
  .up-why-h { margin: 0 0 16px; font-size: 16px; font-weight: 800; color: var(--ck-ink); }
  .up-why ul { margin: 0; padding: 0; list-style: none; }
  .up-why li {
    display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px;
    font-size: 15px; line-height: 1.45; color: var(--ck-body);
  }
  .up-why li:last-child { margin-bottom: 0; }
  /* 1px of nudge, not baseline alignment: the disc is a circle and its optical
     centre sits a touch above the cap line of the 15px text beside it. */
  /* Green again (client, 2026-08-31, reversing that morning's orange in the
     same breath as the headline). The argument for orange was that these discs
     are the case for buying, not the "already included" tick the rest of the
     flow uses, and that green would blur the two. That reading lost to a
     simpler one: the client wants one colour doing emphasis on this screen and
     it is the button's. The bold lead-in beside each stays `--ck-ink` for the
     reason it always did — two coloured marks on one line make the list louder
     than the headline above it, whichever colour they are. */
  .up-why svg { flex: 0 0 auto; width: 19px; height: 19px; margin-top: 1px; color: var(--ck-green); }
  .up-why b { color: var(--ck-ink); font-weight: 800; }

  /* ---- 35: the offer's own arithmetic ----
     A panel inside the card, not a `.ck-bill` card of its own: this is the
     offer's maths and belongs inside the thing being offered. Its rows are
     tighter than the checkout's 54px lines for the same reason — there are three
     and they support the price below rather than being the screen's subject. */
  .up-bill {
    margin: 26px 0 0; padding: 16px 16px 18px;
    border: 1px solid var(--ck-hair); border-radius: var(--radius-in);
  }
  /* ---- the caution line ----
     **`--warn-ink` amber, matched off a reference image** (client,
     2026-09-01), on no plate, with the triangle riding `currentColor`.

     The ladder, since the next person should not have to re-walk it:

       1. #7A5D00 type, no fill                     5.9:1
       2. #6B4A00 on a #FFF1C2 plate                7.2:1
       3. #FFD100 type, no fill                     1.39:1
       4. `--blk` on a #FFD100 plate               14.3:1
       5. `--blk` type, no fill                    19.6:1
       6. `--error` type, no fill                   4.8:1
       7. `--accent-ink` type, no fill              5.2:1
       8. `--warn-ink` type, no fill — this         2.7:1

     **8 does not clear AA and every state above it did.** The bar is 4.5:1:
     this line is 15px/700 on desktop and 14px on phones, and neither is WCAG
     large text — that threshold is 18.66px for bold — so no size this line
     realistically takes moves it to the 3:1 one. 2.73:1 is also under 3:1, so
     it would fail even if it were large.

     **This was shipped knowingly, on a supplied reference image.** It is the
     one deliberate AA failure in the flow. The nearest amber that clears at
     this weight is **#96601A (5.00:1)** — the same hue carried down until it
     passes, and swapping `--warn-ink` to it is the whole fix if this is ever
     revisited. #B87A28 (3.40:1) is the midpoint and is not enough.

     **The colour is the whole warning.** With no plate, nothing but the hue
     separates this line from a caption — which is what makes the hue's
     legibility the thing to protect here, and why the number above matters more
     on this line than it would on decoration.

     **It is not the pending pill's orange.** That is `--accent-ink` (#C23604),
     from its own separate reference on the same day, and the two were given as
     two different pictures — so they are two tokens on purpose. Do not
     "consolidate" them without asking; they have diverged deliberately.

     **The yellow is gone from the flow entirely** — the notes further up this
     file that call `.up-warn` "the only yellow" and pair it with
     `.up-hero-save` as yellow-against-green are describing state 4, not this.

     The padding stays with the plate removed: it is what holds the 18px gap to
     the savings box below off the sentence itself. */
  /* 18px under it, up from 12 (2026-08-26, the client marked this gap). The two
     lines are an argument in two halves — what you are saving now, then what you
     could be saving — and they were reading as one block. The pill's own fill
     starts hard at the boundary, so the space between them has to do all the
     separating on its own and 12px was not enough of it. */
  /* 15px, up from 14 (2026-08-31, the client asked for the line and its mark a
     little bigger). It does **not** buy a different contrast bar: 15px bold is
     short of WCAG's 18.66px large-text threshold, so this line is held to
     4.5:1 at either size. The colour has to clear on its own. */
  .up-warn {
    margin: 0 0 18px; display: flex; align-items: center; justify-content: center;
    gap: 7px; padding: 12px 16px;
    color: var(--warn-ink);
    font-size: 15px; font-weight: 700; text-align: center;
  }
  /* Back to `currentColor` — the triangle and the sentence are one red now, so
     naming the token twice would be two places to change it.
     18px, up from 16 with the type: the triangle was set to sit a shade above
     the cap height and holding that ratio is what keeps it reading as a mark on
     the sentence rather than an icon parked beside it. */
  .up-warn svg { flex: 0 0 auto; width: 18px; height: 18px; }
  /* The sentence holds one line down to ~330px and wraps below it. `balance`
     rather than the default so the break falls mid-sentence instead of dropping
     "$99" alone on a second line — the figure is the point of the warning and a
     widow is the worst place for it. It applies to the wrapper span, which is
     the flex item; on `.up-warn` itself it would balance the flex row and do
     nothing. */
  .up-warn > span { text-wrap: balance; }

  /* **Block, not flex** (2026-08-26). It was a centred flex row, which was fine
     while the figure was baked into the sentence — once the tier choice made
     the number a `<span>` hook, every loose word around it became its own flex
     item and the row's `gap` opened up inside the sentence: "on the 36 -tablet
     plan". A block with inline children spaces itself the way type does, and the
     big figure only ever needed to be a larger inline `<b>`. */
  /* **`--radius-in`, not a pill** (2026-08-26, client's mark). At 999px it was
     the one fully-rounded box on a screen of 12 and 16px corners, and a 60px
     tall pill reads as a button you can press. 12px is what `.ck .cta` uses, so
     it now matches the thing that *is* pressable in shape while staying a panel
     in weight. The small tags around it keep their pill &mdash; those are tags,
     and a tag is pill-shaped by convention. */
  .up-hero-save {
    margin: 0; padding: 12px 16px; background: var(--ck-green-wash);
    border-radius: var(--radius-in); color: var(--ck-green-ink);
    font-size: 15px; font-weight: 600; text-align: center; line-height: 1.5;
  }
  .up-hero-save b {
    font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 2px;
  }

  .up-rows { margin: 14px 0 0; }
  /* Label 15, figure 17 (2026-08-26, the client marked the figures as too small).
     Both are steps on the `.ck` ramp and the pair mirrors the checkout's own
     bill, where the label sits a step under the number it answers rather than
     matching it &mdash; the figure is what the row is for. Row padding goes 5 to
     6 with them, or the taller type closes the gaps between rows. */
  .up-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    /* Label 16 at 500, up from 15 at 400 (client's mark, 2026-08-26). The
       figures went up a step first and left the labels looking thin beside them;
       they name what each figure is, so they carry the row as much as it does.
       The figure stays a step above at 17/700, which is what keeps the two
       distinguishable now that they are close in size. */
    padding: 6px 0; font-size: 16px; font-weight: 500; color: var(--ck-body);
  }
  /* The struck one is this row's **own** figure, not a price struck against a
     neighbour, so it takes the same size as the other two and is separated by
     colour and the rule through it instead. */
  .up-row s, .up-amt { font-size: 17px; }
  .up-row s { color: var(--ck-faint); font-weight: 600; text-decoration-thickness: 1px; }
  .up-amt { font-weight: 700; color: var(--ck-ink); }
  .up-amt.green { color: var(--ck-green); }

  /* `--neutral-tint`, the flow's own grey panel, not a fourth surface colour. */
  .up-price {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin: 14px 0 0; padding: 14px 16px;
    background: var(--neutral-tint); border-radius: var(--radius-in);
  }
  /* 17 and 15, up from 15 and 13, with the gap between them 3px to 8 (client's
     marks, 2026-08-26). They were set against the 32px figure beside them as if
     they were its caption; they are the other half of the row — what the plan is
     called, and what it saves &mdash; and the 3px had them reading as one
     wrapped line rather than as two statements. */
  .up-price-l b { display: block; font-size: 17px; font-weight: 800; color: var(--ck-ink); }
  .up-price-l > span { display: block; margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--ck-green); }
  .up-price-r { flex: 0 0 auto; text-align: right; }
  /* 32px, the largest figure on the screen — above the checkout total's 26,
     because this one is the whole argument and there is nothing else on the page
     competing with it. */
  .up-price-r b {
    display: block; font-size: 32px; font-weight: 800; letter-spacing: -0.03em;
    color: var(--ck-ink); line-height: 1;
  }
  .up-price-r s {
    display: block; margin-top: 4px; font-size: 14px; font-weight: 600;
    color: var(--ck-faint); text-decoration-thickness: 1px;
  }
  /* 14px at 500, up from 13 at 400 (2026-08-26, the client marked this line).
     It lists what the money actually buys, which is the last thing read before
     the button — it was set as fine print and is not. The label comes up with it
     to 13 so it still reads a step under the list it introduces rather than
     shrinking against it. */
  .up-includes {
    margin: 14px 0 0; font-size: 14px; font-weight: 500;
    line-height: 1.55; color: var(--ck-muted);
  }
  .up-includes b {
    color: var(--ck-ink); font-weight: 800; font-size: 13px;
    text-transform: uppercase; letter-spacing: .04em;
  }

  /* ---- 35: the ask ---- */
  /* **The whole closing block came up a step on 2026-08-26**, with the client's
     "font size need to be increased" against the reference. It is the last thing
     read before the button and it was set two steps under the card above it, so
     the page trailed off exactly where it should have been closing.

     Sizes come off the `.ck` ramp (20 / 17 / 14 / 13.5) and the gaps between the
     lines opened with them &mdash; type that grows into unchanged spacing reads
     as more cramped, not larger. */
  .up-close { margin: 28px 0 0; text-align: center; }
  .up-close h3 { margin: 0; font-size: 20px; font-weight: 800; color: var(--ck-ink); line-height: 1.3; }
  .up-close p { margin: 6px 0 0; font-size: 17px; color: var(--ck-body); }
  /* `.up-close .up-lock` rather than the three `!important`s this carried. It
     sits under `.up-close p`, which is the same 0,2,0 specificity and earlier in
     this file, so what it needed was a parent in front of it &mdash; not a
     bigger hammer. */
  /* **No italic anywhere on this screen from 2026-08-26.** The product line lost
     its slant earlier the same day and this one followed — the client's call
     both times. The reference italicises both, where they read as asides; here
     the card is doing the selling and an aside in the middle of it reads as
     small print rather than as a term of the offer. 16 at 600, up from 14. */
  /* **A step lighter across the whole closing block** (2026-08-26: "more grey,
     not too dark"). Everything here moves one rung down the `.ck` ink ramp —
     `--ck-ink` to `--ck-muted`, `--ck-muted` to `--ck-faint`, `--ck-body` to
     `--ck-muted` — rather than picking new greys, so the block stays on the
     scale the checkout and this screen share.

     `--ck-faint` (#767680) is 4.97:1 on white and that is the floor here. It is
     enough for the 16px/600 and 15px/500 this block sets at, and it is **not**
     enough for anything smaller or lighter — if a line in here ever drops below
     15px, it has to come back up the ramp. */
  .up-close .up-lock {
    margin-top: 14px; font-size: 16px; font-weight: 600; color: var(--ck-faint);
  }
  /* Up with it: 15 at 500 from 13.5 at 400. This is the sentence that says the
     card will be charged again, so it is the one piece of running copy on the
     screen that should not read as fine print. */
  .up-terms {
    margin: 18px 0 0; text-align: center; font-size: 15px; font-weight: 500;
    line-height: 1.6; color: var(--ck-faint);
  }
  .up-bypass { margin: 20px 0 0; text-align: center; font-size: 19px; font-weight: 700; color: var(--ck-muted); }
  /* `.up` in front of each of these three on purpose. `.ck .cta` sets a 24px
     top margin (18 on a phone) and it is the same 0,2,0 specificity as
     `.up-bar .cta` would be, so which one wins would come down to which sits
     lower in this file — and the phone tier's copy sits below everything here.
     The extra class settles it in both tiers. The bar and the guarantee button
     take `margin: 0` for the same reason: inside `.up-bar` a 24px top margin on
     one of two buttons knocked the pair 9px out of line with each other. */
  .up .up-offer .cta { margin-top: 14px; }
  /* The decline is type, not a button shape. The reference sets it the same way
     and it is the right call: giving it a border would make the screen a choice
     between two equal options, which is not what it is. Underlining only the
     first two words keeps the target obvious without a box. */
  .up-decline {
    display: block; width: 100%; margin: 18px 0 0; padding: 6px;
    background: none; border: 0; font-family: inherit; font-size: 15px;
    color: var(--ck-muted); cursor: pointer;
  }
  .up-decline u { font-weight: 700; }
  .up-decline:hover { color: var(--ck-body); }
  .up-decline:disabled { cursor: default; color: var(--ck-faint); }

  /* Once the offer has been answered every control on the screen is spent, so
     they all go quiet — except the one that was pressed, which carries the
     reply. `.finish-done` is set by the finish handler in build.py. Opacity
     rather than a colour: these are five different components (two fills, an
     outline and a line of type) and one dial dims the set consistently without
     four disabled palettes. */
  .up [data-finish]:disabled { opacity: .4; cursor: default; }
  .up [data-finish].finish-done { opacity: 1; }

  /* ---- 35: the testimonial head ----
     The cards themselves are `.ck-tests`, unchanged — same four reviews, same
     navy, as the checkout directly above. Only the heading is this screen's. */
  .up-testhead { margin: 44px 0 26px; text-align: center; }
  /* **36px, and 800 is the ceiling** (2026-08-26: "more big and add more
     weight"). Plus Jakarta Sans ships here as a variable face with a
     `font-weight: 400 800` range — see the `@font-face` at the top of this file
     — so this heading was already at the heaviest weight the font has, and
     asking for 900 would clamp back to 800 with nothing to show for it. The
     extra weight comes from the two dials that were still free: six more pixels,
     and the tracking pulled from -0.025 to -0.03em, which closes the letters up
     and reads denser at this size.

     **If a heavier headline is ever genuinely needed, the font is the change** —
     a static 900 cut of Plus Jakarta Sans, added as a second `@font-face`. Do
     not fake it with `-webkit-text-stroke` or a text-shadow. */
  .up-testhead h2 {
    margin: 0 0 16px; font-size: 36px; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1.14; color: var(--ck-ink); text-wrap: balance;
  }
  /* Green with the page headline above it. The pairing is the point and it
     survived the colour going orange and back again in one day: same weight,
     same job, 36px apiece, and one in each colour would read as two different
     kinds of emphasis on one screen. **Move them together or not at all.** */
  .up-testhead h2 b { color: var(--ck-green); font-weight: 800; }
  /* 18px under the eyebrow and 16 under the headline, up from 12 and 10. The
     three lines were stacked tight enough to read as one block; with the
     headline six pixels larger they needed the room more, not less. */
  .up-testhead .up-eyebrow { margin-bottom: 18px; }
  .up-testhead p { margin: 0; font-size: 16px; color: var(--ck-body); }

  /* ---- 35: the testimonial ticker ----
     White cards, at the client's word on 2026-08-26: "make them white like the
     reference... you did it before for the intake form." The reference is
     **screen 3**, so these are that screen's `.tcard` verbatim — white ground,
     `--border` hairline, `--shadow-card` — and nothing is restyled here.
     `.ck-tests` and its navy cards are untouched and stay the checkout's; the
     two screens now show the same four reviews in two treatments, which is
     deliberate and the client's call.

     **The rail is screen 3's too, from 2026-08-27.** It drifted as a ticker
     until the client marked it cut off — a moving track shears a card at each
     end and gives no way to reach the rest, so both edges read as broken rather
     than as continuing. The markup now carries `.rail` itself, which brings that
     screen's flex row, 12px gap, snap points, visible scrollbar and shadow
     padding, and `.railnote` closes it with the same "Scroll for more" line. A
     card cut off at the right edge is fine once there is a scrollbar under it
     saying so; that is exactly how screen 3 sits.

     What went with the ticker: `.up-rail-track`, the `up-ticker` keyframes, the
     hover-to-pause rule, the reduced-motion fallback and the `body.frames`
     freeze. All five existed to manage an animation. The cards were also emitted
     twice — see steps.py — and are now emitted once.

     **`.up-rail` is left holding the width and nothing else.** The band is wider
     than the 620px column the rest of the page keeps, which is what it was
     full-bleed for and what the client's reference shows, but it is capped
     rather than bled: at screen 3's own 940px, and never wider than the window.
     `calc(50% - w/2)` either side centres it, where 50% is half the column — a
     transform would work too but would make this a containing block for anything
     fixed inside it, and this screen has a fixed bar. */
  .up-rail {
    /* `100vw` counts the scrollbar on desktop, so the 32px keeps the cap clear
       of it rather than overflowing by its width. */
    --rail-w: min(940px, calc(100vw - 32px));
    width: var(--rail-w);
    margin-inline: calc(50% - var(--rail-w) / 2);
  }
  /* The static frames have no viewport to measure — `100vw` there is the real
     window, not the 1040px frame, so the cap would be computed against the wrong
     thing. Back to `.rail`'s own width and gutters for those. */
  body.frames .up-rail { width: auto; margin-inline: -8px; }

  /* ---- 35: the guarantee ----
     **Green, and this is the fifth setting** — read the history before changing
     it a sixth time, because it has been round this loop once already. It
     shipped `--accent-soft` in a #F7DCD2 hairline; went green on 2026-08-26
     ("like you did for pricing cards"); came back to orange within the hour on
     "make this box color to orange tone from our primary color"; lost its border
     the same day for a flat #FEF6F3; and on **2026-08-27** the client asked for
     "soft green trustworthy color", "little green stroke" and the tick in green
     — then took the stroke off again within the minutes, exactly as the orange
     border went on 2026-08-26. So it is `--ck-green-wash` on its own, and the
     `--ck-green` ring is the only full-strength green on the panel. **Tokens,
     not a literal** — the flat #FEF6F3 was the one hardcoded colour on this
     screen and it is gone with the orange.

     **This panel has now lost a border twice.** Both times it was added at the
     client's ask and taken off in the next message, and both times it separates
     from the page on fill alone — which works because `--page` is grey and this
     is not. If a border is ever asked for a third time, expect it to come off.

     **The eyebrow is `--ck-green-ink`, and that finally settles a long
     contrast argument.** It ran `--accent` from the start and never cleared:
     3.81:1 on the warm ground, 3.65:1 once the ground went green, against the
     4.5:1 a 14px/800 label needs (bold counts as large text only from 18.66px).
     It was moved to `--accent-hover` at ~11:1 for that reason and the client
     asked for orange back, twice. On 2026-08-27 they asked for green — which is
     the token the ramp already nominates for type on this wash — and it
     measures **8.18:1**. The objection and the client's preference now point the
     same way, so this is no longer a standing exception; if orange is ever asked
     for again, it is back to being one.

     Everything on the panel clears comfortably now: eyebrow 8.18:1, headline
     15.61:1, body copy 9.7:1, and the ring 4.5:1 against a graphic's 3:1 bar. */
  /* **A centred stack at every width** (client, 2026-08-31): "put the tick mark
     on the top, all should be centre aligned". It was a row — 96px ring at the
     left, copy ragged-right beside it — which already became this stack under
     720px, so what changed is that the phone's treatment is now the only one.

     It fixed the headline at the same time, and that is worth knowing before
     anyone puts the row back. Beside the ring the copy column was ~390px, and
     the two halves of "The only thing you'll lose / is performance anxiety."
     each wrapped again inside it — the `<br>` that was meant to make two lines
     was making four. Full width the column is ~500px and both halves clear it
     with room. **The stack is what makes that break safe**; restore the row and
     the headline needs re-measuring.

     The ring keeps its 96px here and drops to 72 on a phone, as it always did.
     `text-align: center` on the panel rather than on each child: the eyebrow,
     the headline and the paragraph all take it, and there is nothing in here
     that should be ragged. */
  .up-guar {
    /* 44px above, up from 30 (client, 2026-08-26). The ticker above it is
       full-bleed and this panel is not, so the two need a real gap to read as
       separate blocks rather than as a rail with a box stuck to it. */
    display: flex; flex-direction: column; align-items: center; text-align: center;
    /* 18, not the row's 24: that gap ran between the ring and a block of copy,
       and this one runs between the ring and the 12px eyebrow directly under
       it, which needs less air to read as belonging to it. */
    gap: 18px; margin: 44px 0 0;
    padding: 32px 28px; border-radius: 24px;
    background: var(--ck-green-wash);
  }
  /* Green again (client, 2026-08-31), but **not the green it started as.**
     The reason it was moved to orange that morning still stands: it is the
     largest thing on the screen and `--ck-green` on the panel's own
     `--ck-green-wash` is 4.5:1, one family at two strengths, which read as
     decoration rather than as the panel's mark. `--ck-green-ink` is 8.2:1 on
     that wash — green, as asked, and legible as a mark. If this ever goes back
     to `--ck-green` the ring disappears into its ground again; that is the
     failure this token is here to avoid, not a preference. */
  .up-guar-mark { flex: 0 0 96px; height: 96px; color: var(--ck-green-ink); }
  .up-guar-mark svg { display: block; width: 100%; height: 100%; }
  /* `max-width` rather than `flex: 1 1 auto`: as a column child it would stretch
     to the panel's full inner width, and the paragraph — 14.5px running copy —
     would set to a 500px measure. 46em on the paragraph's own size is the
     measure the rest of the flow's centred copy takes. The headline is wider
     than that and is allowed to be; it sets its own two lines. */
  .up-guar-info { width: 100%; min-width: 0; }
  /* **`.up-guar-info` in front, and it is load-bearing.** `.up-guar-info p` two
     rules below sets `--ck-body` at 0,2,0 and this label is a `<p>` inside that
     block, so a bare `.up-guar-eyebrow` at 0,1,0 lost to it — silently. Every
     colour set on this label since it was written had no effect at all: it went
     `--accent`, then `--ck-green-ink`, then `--accent-hover`, and rendered
     `--ck-body` grey throughout. Caught on 2026-08-26 by reading the computed
     colour back rather than trusting the rule. */
  .up-guar-info .up-guar-eyebrow {
    margin: 0 0 8px; font-size: 14px; font-weight: 800; color: var(--ck-green-ink);
  }
  /* 28px, up from 24 (2026-08-26). It is a panel headline with a 96px mark
     beside it, not a card heading, and at 24 it was the same size as the product
     name three sections above — which made the last thing on the page read as
     the least important.

     **28 widens this screen's scale rather than sitting beside it.** The `.ck`
     ramp tops out at 26 because every heading on the checkout lives inside a
     card; screen 35 has three headlines that do not (36 on the page headline,
     36 on the testimonial head, 28 here), and the note on that ramp asks for it
     to be widened rather than for one-offs to be dropped in. These three are
     that widening — do not add a fourth without the same reasoning. */
  .up-guar-info h2 {
    margin: 0 0 12px; font-size: 28px; font-weight: 800; letter-spacing: -0.022em;
    line-height: 1.2; color: var(--ck-ink);
  }
  /* No bottom margin: the button this used to clear was removed on 2026-08-27
     and the paragraph is the last thing in the panel now, so 18px would have
     been dead space inside the fill. `.up .up-guar .cta` went with the button —
     it existed to beat `.ck .cta`'s own top margin, which nothing here sets any
     more. */
  .up-guar-info p {
    margin: 0 auto; max-width: 46em; font-size: 14.5px; line-height: 1.55;
    color: var(--ck-body);
  }

  /* ---- 35: the sticky bar ----
     Fixed to the viewport floor, which the reference does at every scroll
     position of this page. It is a child of the step, so it renders only while
     this screen is active — an inactive `.step` is `display: none` and a fixed
     child of that draws nowhere, which is why this needs no JS to show or hide
     it.

     No `env(safe-area-inset-bottom)` and no `viewport-fit=cover`: the page
     deliberately does not opt into the display cutout (see the note on the
     viewport tag in build.py), so the viewport already stops above the home
     indicator and the bar lands on top of it rather than under it. */
  .up-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px 16px; border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, .93);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .up .up-bar .cta { margin: 0; width: auto; min-width: 330px; min-height: 54px; font-size: 16px; }
  /* `--radius-in` (12px), not a pill (2026-08-26, client's mark). It sits
     directly beside the bar's CTA, which is 12px from `.ck .cta`, and two
     buttons on one row in two different corner radii read as two different
     kinds of control. Same call as the savings box earlier the same day. */
  .up-bar-no {
    flex: 0 0 auto; min-height: 54px; padding: 0 26px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-in);
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ck-body); cursor: pointer;
  }
  .up-bar-no:hover { border-color: var(--hover-border); }
  .up-bar-no:disabled { cursor: default; color: var(--ck-faint); }
  /* The static frames have no viewport to pin to — every frame in
     all-screens.html would stack its own copy on the window's floor. Unpinned,
     it sits where it falls, at the foot of the screen it belongs to, which is
     what the design shows anyway. */
  body.frames .up-bar {
    position: static; margin-top: 30px; border: 1px solid var(--border);
    border-radius: 16px; background: var(--surface); backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.frames .up { padding-bottom: 0; }


  /* ==========================================================================
     36 — order confirmed
     The thank-you screen, built 2026-08-26 from the competitor's confirmation
     page with the client's brief "keep the copy same" and everything else — type
     scale, ink ramp, spacing, colour — taken from screen 35.

     **It wears `.ck` like 34 and 35**, so nothing below restates a grey or a
     size that ramp already has. The reference's accent is blue throughout; here
     it is `--accent`, because this flow has one accent and the step numbers,
     the onset heading and the highlighted range are exactly the "emphasis, not
     decoration" that house rule 2 describes.
     ========================================================================== */

  /* ---- 36: the cover ----
     Full-bleed by the same `calc(50% - 50vw)` the upsell's ticker uses, for the
     same reason: no transform, so nothing inside becomes a containing block, and
     no `100vw`, which would count the scrollbar. */
  .ty-cover {
    position: relative; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    min-height: 340px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; text-align: center;
  }
  .ty-cover img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 32%;
  }
  /* The scrim, not a flat overlay. braevon.com's hero is dark on the right and
     bright across the faces, so a single tint either washes the photograph out
     or leaves the copy sitting on skin. A vertical gradient weighted to the
     middle keeps the type on its darkest band and lets the edges of the picture
     through. White on this measures better than 7:1 across the whole plate. */
  .ty-cover::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(9, 11, 18, .62) 0%, rgba(9, 11, 18, .78) 45%, rgba(9, 11, 18, .68) 100%);
  }
  .ty-cover-in {
    position: relative; z-index: 1; max-width: 560px; padding: 46px 20px;
  }
  /* The green tick is the flow's own `--green`, not the checkout's deeper
     `--ck-green`: that one is tuned to carry white text on a pale wash, and this
     is a mark on near-black where the lighter green reads better. */
  .ty-placed {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 0 0 14px; font-size: 15px; font-weight: 600; color: #FFFFFF;
  }
  .ty-placed svg { width: 19px; height: 19px; flex: 0 0 auto; color: var(--green); }
  /* 36px, the same step the upsell's two page headlines take — this is the third
     of them and the note on that scale in the `.up` block covers it. */
  .ty-cover h1 {
    margin: 0 0 16px; font-size: 36px; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1.14; color: #FFFFFF; text-wrap: balance;
  }
  .ty-sub { margin: 0; font-size: 16px; line-height: 1.55; color: #E4E6EC; text-wrap: pretty; }

  /* ---- 36: next steps ---- */
  .ty-h2 {
    margin: 40px 0 18px; font-size: 28px; font-weight: 800; letter-spacing: -0.022em;
    color: var(--ck-ink); line-height: 1.2;
  }
  .ty-card { padding: 26px 24px; }
  .ty-steps { margin: 0; padding: 0; list-style: none; }
  /* The rail down the left is one border on the step, with the marker sitting on
     top of it — not a pseudo-element per row plus a separate line, which is what
     leaves a gap between the two on a zoomed page. The last step keeps the
     padding and loses the line, so the rail stops at the last marker rather than
     running past it into white space. */
  .ty-step {
    position: relative; padding: 0 0 26px 30px;
    border-left: 2px solid var(--accent-soft);
  }
  .ty-step:last-child { padding-bottom: 0; border-left-color: transparent; }
  .ty-step::before {
    content: ""; position: absolute; left: -8px; top: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .ty-step-n {
    margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent);
  }
  .ty-step-h {
    display: flex; align-items: center; gap: 9px; margin: 0 0 8px;
    font-size: 19px; font-weight: 800; color: var(--ck-ink); line-height: 1.25;
  }
  .ty-step-h svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--ck-body); }
  .ty-step-p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ck-body); }
  .ty-facts { margin: 12px 0 0; padding: 0 0 0 18px; list-style: disc; }
  .ty-facts li {
    margin: 0 0 6px; font-size: 15px; line-height: 1.5; color: var(--ck-body);
  }
  .ty-facts li:last-child { margin-bottom: 0; }
  .ty-facts b { color: var(--ck-ink); font-weight: 800; }
  /* The live dot beside "In process". `--green` again rather than `--ck-green`:
     it is a status light, and the brighter one is what reads as one. */
  .ty-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); margin-right: 7px; vertical-align: 1px;
  }

  /* ---- 36: the onset block ---- */
  .ty-onset {
    display: flex; align-items: center; gap: 28px; margin: 40px 0 0;
  }
  .ty-onset-copy { flex: 1 1 auto; min-width: 0; }
  .ty-onset-h {
    margin: 0 0 14px; font-size: 28px; font-weight: 800; letter-spacing: -0.022em;
    color: var(--accent); line-height: 1.2;
  }
  .ty-onset-lead { margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--ck-body); }
  .ty-onset-list { margin: 0; padding: 0 0 0 20px; list-style: disc; }
  .ty-onset-list li { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: var(--ck-body); }
  .ty-onset-list li:last-child { margin-bottom: 0; }
  .ty-onset-list b { color: var(--ck-ink); font-weight: 800; }
  .ty-hi { color: var(--accent); font-weight: 800; }
  /* No `color` any more: the drawn stopwatch took `--accent` and the client's
     photograph carries its own silver. `contain` rather than `cover` because the
     asset is portrait and the slot is square — cropping it would take the crown
     off the top, which is the part that reads as a stopwatch rather than a
     watch. `margin: 0 auto` centres the narrower image in the square. */
  /* 160px from 2026-08-27, up from the 96 the drawn icon sat at — the client
     asked for the photograph bigger and the row has the width for it: the copy
     column is `1 1 auto` and gives up 64px without reflowing. A drawing reads at
     96; a photograph of a dial with numerals on it does not, which is what the
     ask is really about. The asset was re-exported at 384px tall to cover it. */
  .ty-onset-mark { flex: 0 0 160px; height: 160px; }
  .ty-onset-mark img {
    display: block; width: 100%; height: 100%; object-fit: contain; margin: 0 auto;
  }

  /* ---- 36: questions ----
     `.ck-faq` verbatim from the checkout, so the rows, rules and chevron are
     that screen's and there is no second accordion treatment in the flow. */
  .ty-faq { margin-top: 40px; }
  .ty-faq .acc-body p { margin: 0 0 16px; }
  .ty .cta { margin-top: 34px; }

  /* ==========================================================================
     DESKTOP SCALE
     The flow was tuned on a phone and then simply centred on a laptop, which
     left the type and the measure looking undersized on a big screen. This
     block scales the whole thing up above 900px — wider columns, larger type,
     taller controls — without touching the phone tuning below.
     ========================================================================== */
  @media (min-width: 901px) {
    /* Column widths move together: the masthead, the navrow's inner width and
       the question column must stay on one edge, or the logo and progress bar
       drift off the copy. navrow carries 20px of padding either side. */
    .stage      { max-width: 1180px; }
    /* The masthead's 640 lives on `--mast-w` up in the chrome block, not here —
       32 and 33 need a third value and a literal in this rule cannot give them
       one. Same set, stated in one place. */
    .col        { max-width: 640px; }
    .split      { max-width: 1100px; gap: 56px; }
    .wide-col   { max-width: 1100px; }

    p.sub   { font-size: 17px; }
    p.lead  { font-size: 18.5px; }
    .opt    { font-size: 16.5px; min-height: 62px; padding: 18px 18px; }
    .opt .lbl small { font-size: 14px; }
    .tile   { font-size: 16.5px; min-height: 64px; }
    .cta    { font-size: 17px; min-height: 62px; padding: 19px 18px; }
    .field label { font-size: 13px; }
    .field select, .field input, .field textarea { font-size: 16px; min-height: 54px; }
    .fieldset-label { font-size: 14px; }
    .note p { font-size: 15px; }
    .note.dark .nt { font-size: 16px; }
    .checkcard li { font-size: 16px; }
    .feat   { font-size: 17px; padding: 16px 18px; }
    .feat svg { width: 19px; height: 19px; }
    .statcard .n { font-size: 56px; }
    .statcard .t { font-size: 16px; }
    .badges { font-size: 14.5px; }
    .privacy { font-size: 13.5px; }
    .tcard  { flex: 0 0 340px; }
    .tcard h3 { font-size: 16.5px; }
    .tcard p  { font-size: 14.5px; }
    .railnote { font-size: 16px; }
    .rating .txt { font-size: 13px; }
    .masthead .logo svg { height: 25px; }
    .rating .ck-stars i { width: 14px; height: 14px; }
    .rating .ck-stars svg { width: 10px; height: 10px; }
  }

  /* Large laptops and up: widen the marketing split so the product grows and the
     headline drops from four lines to three, which is what actually buys the room
     for the CTA to clear the fold. Must sit after the 901px block — same
     specificity, so source order decides. */
  @media (min-width: 1300px) {
    .stage    { max-width: 1320px; }
    .split    { max-width: 1240px; }
    .wide-col { max-width: 1240px; }
  }
  @media (min-width: 1440px) {
    .stage    { max-width: 1420px; }
    .split    { max-width: 1340px; }
    .wide-col { max-width: 1340px; }
  }
  /* ---- laptop tier: 13" and 14" MacBooks ----
     A closed *range*, not a min-width, and that is the point: everything wider
     than this is a real external display, where the client asked for the design
     to stay exactly as it is. So this block owns the whole token set for laptop
     widths and nothing leaks upward — above 1500px the `:root` values apply
     untouched. 1280 and 1440 (both common MacBook widths) land here.

     The trims are small on purpose. 46px of headline and 27px between the
     subtitle and the first option is a lot of an 800px-tall window before
     anything is answerable; this is roughly 30px back without the screen
     reading as cramped. */
  @media (min-width: 901px) and (max-width: 1499px) {
    :root {
      --fs-title:    43px;
      --gap-eyebrow: 11px;
      --gap-title:   20px;
      --gap-sub:     22px;
      --gap-block:   21px;
      --gap-cta:     16px;
      --gap-opt:      9px;
    }
    .opt  { min-height: 58px; padding: 15px 18px; }
    .cta  { min-height: 58px; padding: 17px 18px; }
    .tile { min-height: 60px; }
    p.sub { font-size: 16px; }
  }

  /* Only here does the headline go back to its full size — 1500px is past both
     common MacBook widths, so this is a real external display. */
  @media (min-width: 1500px) {
    :root { --fs-title: 56px; }
  }

  @media (max-width: 720px) {
    /* The boxed back button and the 4px track cost a lot of vertical space on a
       phone. Collapse to the reference's treatment: a hairline progress line
       edge-to-edge under the header, with the back button beneath it. DOM order
       is button/track, so `order` puts the line on top without moving markup.

       This was briefly a sticky glass chip floating over the content, which
       bought back about 13px and kept the button reachable down a long list. The
       client asked for the row back. Don't re-derive it. */
    .navrow {
      max-width: none; width: 100%; padding: 0; gap: 0;
      display: flex; flex-direction: column; align-items: stretch;
    }
    /* `flex: 1` from the desktop rule would resolve against the cross axis
       here and collapse the line to nothing — pin the height explicitly. */
    .navrow .track { order: 1; flex: 0 0 auto; width: 100%; height: 3px; }
    /* Keeps the desktop box treatment — the bare arrow read as an artefact.
       16px left margin puts it on the same gutter as the question copy. */
    .navrow .back-btn {
      order: 2; flex: 0 0 auto; align-self: flex-start;
      width: 34px; height: 34px; margin: 12px 0 0 16px;
    }
    .navrow .back-btn svg { width: 16px; height: 16px; }
    .navrow.no-progress .back-btn { margin-top: 16px; }

    /* Match the stage's 16px gutter so the logo and rating sit flush with the
       question copy below them. */
    .masthead { padding: 12px 16px; }

    /* The phone tier owns the whole token set too. The gaps were tuned on a
       desktop and simply carried down, which on a 375x812 screen spent about
       50px between the eyebrow and the first option — the single biggest reason
       Continue kept landing under the fold. Trimmed as a set rather than
       screen by screen, so the rhythm stays consistent at this width. */
    :root {
      --fs-title:    28px;
      --gap-eyebrow: 10px;
      --gap-title:   16px;
      --gap-sub:     18px;
      --gap-block:   18px;
      --gap-cta:     14px;
      --gap-opt:      8px;
    }
    .stage { padding: 10px 16px 24px; }
    p.sub { font-size: 14.5px; }
    /* Option and CTA come down together — they share a height on purpose (the
       client asked for the two to read at the same size) so neither moves
       without the other. */
    .opt  { min-height: 52px; padding: 14px 16px; }
    .cta  { min-height: 52px; padding: 15px 18px; }
    .tile { min-height: 52px; }
    /* Still the biggest thing on the screen, just trimmed enough that Continue
       lands above the fold on a 812px phone rather than 26px under it. */
    .bp { gap: 12px; margin: 0 0 22px; }
    .bp .cellwrap { flex: 0 0 124px; }
    .bp .cell { font-size: 38px; padding: 10px 12px; min-width: 0; }
    .bp .slash { font-size: 34px; }
    .bp .cap { margin-top: 4px; }
    .bp-lead { margin-bottom: 8px; }
    /* Month / day / year stay three-across on phones, as the reference has them.
       They used to break to 2 + 1, which read as an unrelated third field. */
    .statcard { gap: 14px; padding: 18px 16px; }
    .statcard .n { font-size: 38px; }

    /* The map used to be capped at 320px and centred, because at full width it
       pushed "Good news." and the CTA off a phone screen. The stacking order
       changed on 2026-08-13 — the headline now comes first, above the image —
       so that reason is gone and it runs the full width like every other split
       media. */
    .usmap { margin: 0 0 4px; }

    /* The CTA sits in normal flow on phones, like every other control. It was
       briefly `position: fixed` — parked 50px off the bottom with a scrim under
       it, because Safari's toolbar and the home indicator were covering it at
       the end of a long screen — and the client asked for it back in the page.
       The tail of that change is gone with it: the bottom padding that reserved
       room for the bar, the scrim on `body::after`, and the `animation: none`
       that stopped the step capturing a fixed descendant. Don't re-derive any of
       it; the button being below the fold on a long list is handled by
       `maybeScrollToCta()` in build.py instead. */

    /* ---- screens 32 and 33 on a phone ----
       Both are two-column cards on desktop and both collapse to one column
       here. The product render centres and caps rather than filling the width:
       at 343px a full-bleed tablet is larger than it ever is on desktop and
       pushes the headline off the first screenful. */
    .ap-card { padding: 18px; border-radius: 14px; margin-bottom: 14px; }
    /* 33 states its padding per card at every width — see the checkout block
       above — so only the radius and the gap between cards move here. */
    .ck-card { border-radius: 14px; margin-bottom: 14px; }
    .card-back { top: 10px; left: 10px; }
    /* **32's hero does not stack any more either** — render left, copy right,
       asked for on 2026-08-14 with the layout drawn out, the same note 33 got.
       It replaces the stacked, centred column that stood here, and it is the
       reason the card is now about 250px shorter on a phone.

       The 52px of top padding **stays, and is load-bearing**: the back button
       is absolutely positioned at 10/10 inside this card and is 34px, so it
       occupies y 10-44. The padding is what starts the render below it instead
       of behind it. The client's note was "make sure the back button is still
       clearly visible" — do not reclaim this space by dropping the padding and
       letting the render slide up under the chip.

       The pill gets a row of its own, full width. It cannot sit beside the
       render at any phone size: "Your plan is approved for: 15:00" needs about
       230px of pill and the copy column is 177 at 375 and 142 at 320. That is
       what `display: contents` on `.ap-heroinfo` is for — it lifts the h1, the
       saving line and the pill into this grid so the pill can span both
       columns while the other two stay in the right-hand one. The DOM is
       untouched, so desktop is untouched.

       The render spans the h1 and saving rows, which makes those two rows
       taller than their text; `align-self: end` on the h1 and `start` on the
       line under it push the slack to the outside, so the pair reads as
       centred against the render rather than sprung apart. */
    .ap-hero {
      padding-top: 52px;
      grid-template-columns: clamp(88px, 30vw, 116px) 1fr;
      grid-template-areas: "shot head" "shot save" "timer timer";
      column-gap: 14px; row-gap: 8px;
      align-items: start; text-align: left;
    }
    .ap-heroinfo { display: contents; }
    .ap-shot { grid-area: shot; align-self: start; }
    .ap-shot img { width: 100%; height: auto; }
    .ap-hero h1 { grid-area: head; align-self: end; margin-bottom: 0; }
    .ap-save { grid-area: save; align-self: start; margin-bottom: 0; }
    .ap-timer { grid-area: timer; margin-top: 6px; }
    /* The desktop figures above are the export's, and the export is a 1040px
       page. Undo the four that would follow a stacked phone card down: the
       hero's fixed height, the taller button, and the two big gaps around it. */
    .ap-hero { min-height: 0; }
    .ap-hero .back-btn { width: 34px; height: 34px; }
    .ap .ap-card:not(.ap-hero) { padding-bottom: 18px; }
    /* `.ap-detail`'s 42 is undone by the `.ap-panel { padding: 16px }` further
       down this block — same specificity, later in source — so it needs no
       reset of its own here. */
    .ap-satis { margin-bottom: 20px; }
    .ap .cta { height: var(--h-cta); margin-top: 22px; }
    .ap .badges { margin-top: 20px; }
    /* **33's hero does not stack.** Render left, copy right, at every width —
       the client asked for it on 2026-08-14 with the layout drawn out, so this
       is the one two-column card in the flow that survives the phone. It fits
       because the render shrinks with the column, not because the type does:
       112px of tablet plus a 12px gutter leaves ~180px of field at 320px, and
       the select's 16px floor is untouched. 32 still stacks. */
    .ap-shot img { max-width: 190px; margin: 0 auto; }
    /* Fluid, because the copy column is now only ~142px at 320 and a flat 25px
       broke "Your approval" over two lines there. This is the house-rule-4
       exception the old `.approve h1` used to hold, in its current spelling. */
    .ap-hero h1 { font-size: clamp(20px, 6.2vw, 25px); }
    /* No band above the render any more: 33 lost its back button on
       2026-08-14, so the row just centres in the card the way it does on
       desktop. 32 keeps its button and keeps its 52px. */
    /* **Top, not centre** (2026-08-19, client's ask): the render lines up with
       the headline rather than floating against the middle of a column that is
       much taller than it on a phone. The 2px is the headline's own leading —
       its cap line sits that far below its box — so the orange square's top edge
       and the first letter's top edge agree rather than the boxes agreeing.
       Desktop keeps `center`: there the two columns are within a pixel of each
       other in height and centring is what balances them.

       The gap and the right padding come in 2px apiece. They are not tuning:
       they are two of the four places the benefit lines' width comes from, and
       what they give up is what lets those lines hold one line each. See the
       note on `.ck-benefits span` below. */
    .ck-hero { gap: 8px; padding: 14px 8px 14px 6px; align-items: flex-start; }
    /* **-3.5px, and the number is the PNG's fault.** The client asked for the
       render's top edge to line up with the headline's, and box-to-box alignment
       does not do that here: `product-prime.png` carries ~6% of its height as
       transparent margin, so at 126px the orange square starts 7.5px below the
       box, while the headline's capitals start ~2px below theirs. Measured the
       same at 390 and 440 — 5.7px of drift — and this takes it out. The row is
       driven by the copy column, which is taller, so pulling the render up costs
       the card nothing. Re-measure if the render's size or the file changes. */
    .ck-shot { margin-top: -3.5px; }
    /* 126px, up from 116 (2026-08-19, client's ask). Every pixel of it is taken
       from the copy column beside it, which is what sizes both the headline and
       the benefit lines — so the gap and the benefits box's gutters come in with
       it, and the two clamps below are re-derived against what is left. This is
       the one number on the phone tier that cannot be changed on its own. */
    .ck-shot { flex: 0 0 126px; }
    .ck-shot img { width: 126px; height: 126px; }
    /* 19px, not 20 — at 390px the column beside the render is ~200px and at 20
       the heading wrapped one line further.

       **The heading is long again.** It went to "Braevon Prime(tm)" when the
       client dropped "plan", and on 2026-08-19 became "Braevon Prime(tm)
       prescription plan approval" — five words where there was one. It wraps to
       several lines beside the render on a phone, which is expected of a
       headline that length and is why the hero's height is content-driven rather
       than fixed. Measure before changing this size; the room the short version
       had is spent. */
    /* **Two lines on a phone, filling the column** (2026-08-19, client's ask).
       19px could not: "Braevon Prime(tm) prescription" measures 264px against a
       197px column at 375, so the heading broke three ways. The width that fits
       the better of the two splits — "Braevon Prime(tm)" over "prescription plan
       approval", 236px at 19px — is col x 0.0806, which is 15.9px at 375 and
       more on a larger phone.

       Fluid rather than fixed, and this is the house-rule-4 exception the
       approval's headline already holds, for the same reason: the column here is
       the card minus a 116px render, so it tracks the viewport almost 1:1 and a
       single number can only be right at one width. 4vw lands at 14.4 / 15.0 /
       15.6 / 17px across 360 / 375 / 390 / 430, each of them under what that
       width can take. Below ~360 it wraps to three lines again — the size that
       would hold two there is 11px, which is not a headline.

       Measure before changing it: the sum above is the whole constraint, and the
       ceiling is what stops a 430px phone setting this larger than the section
       questions below it. */
    .ck-hero h1 { font-size: clamp(13.5px, 4vw, 17px); margin-bottom: 10px; }
    /* ---- the benefit lines, one line each (2026-08-19, client's ask) ----
       Smaller and a step heavier, and the size is what buys the single line:
       "Longer duration & satisfaction" measures 200px at 14px/500 against 142px
       of text column at 375, so it broke in two — as did the stamina line.

       Four things widen that column before the type gives anything up: this
       box's padding, the icon, the icon's gap, and the hero's own gap and right
       padding above. Together they hand back ~26px, which is what makes ~11px
       enough rather than the ~10 the old measurements needed.

       Fluid for the same reason the headline is: the column tracks the viewport
       almost 1:1, so one number can only be right at one width. Below ~365 the
       lines wrap again — 360 included, since the render went to 126px — which is
       the graceful end of this: the size that would hold them there is ~10px, and
       shrinking every phone to serve that one is the wrong trade. No `nowrap`
       anywhere here on purpose: a line that cannot wrap does not fail by
       wrapping, it fails by running out of the box. */
    .ck-benefits { padding: 10px 8px; }
    .ck-benefits li { gap: 6px; margin-bottom: 6px; }
    .ck-benefits svg { width: 14px; height: 14px; }
    .ck-benefits span { font-size: clamp(10px, 2.85vw, 12.5px); font-weight: 500; }
    .ck-benefits-h { font-size: 13.5px; margin-bottom: 6px; }
    .ap-timer { width: 100%; justify-content: center; }
    .ck-hero .ck-fld { min-height: 60px; padding: 9px 11px; }
    .ck-hero .ck-fld label { font-size: 13px; margin-bottom: 2px; }
    .ck-hero .ck-fld select { font-size: 16px; }

    .ap-panel { padding: 16px; }
    .ap-pname, .ap-detail-h { font-size: 22px; }
    /* Two ingredient tiles side by side at 343px leave about 150px each, which
       wraps "Stay hard longer" onto three lines. One column instead. */
    /* **Two up on a phone as well, so it stays a 2x2.** Asked for on
       2026-08-14: stacked, the four tiles ran to four full-width rows and
       pushed everything under them most of a screenful down. Each tile is
       ~139px wide at 375 and ~117 at 320, which the longest title
       ("Stay hard longer") sets on two lines rather than clipping.

       **`minmax(0, 1fr)`, not a bare `1fr`.** A bare `1fr` is `minmax(auto,
       1fr)`, so each column floors at its own min-content width — and because
       "APOmorphine" is a longer unbreakable word than "Vardenafil", the two
       columns came out 114 and 98 at 320px instead of matching. Zero as the
       floor is what makes them equal at every width. Do not use
       `repeat(auto-fit, …)` here either: it drops to one column on a narrow
       phone, which is the layout this rule exists to replace.

       The padding and the gap come in with it: 16/12 is desktop's and leaves
       the dose crowded at this width. */
    .ap-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .ap-tile { padding: 13px; }
    .ap-satis { padding: 20px 16px; }
    .ap-satis .n { font-size: 38px; }
    .ap-satis .n sup { font-size: 18px; }
    /* The hairline is on the base rule, so it is already here — only the
       padding comes off a pixel to hold the box at the height it was. */
    .ap-chips span { font-size: 13.5px; padding: 8px 12px; }

    /* ---- 33 on a phone ----
       The ground-level section titles, the navy read-back and the two-up
       testimonials are what have to give; the plan rows keep their desktop
       shape (ring, name, price on one line) because they fit — at 375px the
       inner width is ~311px and the longest row measures about 270px. Wrapping
       it put the figure on a third line and read worse. */
    .ck-lead { font-size: 15px; margin-bottom: 14px; }
    /* Steps down with its neighbour, staying on the ramp (19 -> 17). */
    .ck-lead-ask { font-size: 17px; }
    .ck-secthead { margin-bottom: 16px; }
    .ck-secthead h2 { font-size: 22px; }
    .ck-faqh { font-size: 22px; margin-bottom: 22px; }
    .ck-planscard { padding: 14px; }
    .ck-plans { gap: 12px; }
    .ck-plan-row { gap: 10px; padding: 0 14px; min-height: 74px; }
    .ck-plan-badge { font-size: 12px; height: 27px; line-height: 27px; padding: 0 14px; }
    /* **The row stays one line down to 481px**, asked for on 2026-08-17 with the
       type allowed to shrink for it. Measured rather than guessed — at a given
       row width the three strings cost, per 1px of font size, 6.23px for
       "Monthly Plan", 14.45px for "Billed monthly. Cancel anytime" and 7.89px
       for "(20 tablets/mo)", those being the longest of each. Two steps down are
       enough to hold the line to 481px; the stacking floor below that is in its
       own block further down, with the arithmetic for why it exists. */
    .ck-plan-row { gap: 8px; }
    .ck-plan-main { gap: 10px; }
    .ck-plan-main b { font-size: 15px; }
    .ck-plan-main small { font-size: 12px; }
    .ck-plan-meta { font-size: 15px; }

    /* "Doctor consultation" and its Free pill do not fit on one line at this
       width, so the pill drops under the label. Top-align the row when that
       happens or the amount floats to the vertical middle of a two-line label
       and lines up with nothing. */
    .ck-bill { padding: 0 16px; }
    /* The row carries the padding now, not the heading — leaving it on the `h2`
       would push the title off the price it is meant to sit level with. */
    .ck-billhead { padding: 17px 0; }
    .ck-billh { font-size: 22px; }
    /* 19px against the title's 22, holding the same one-step gap as desktop. */
    /* `min-height: 0` here, so the padding is what sets the row height — the
       desktop 62/82 do not reach a phone at all. Up from 13/16 with the same ask,
       and by a matching amount once doubled: 13 -> 17 adds 8px a row. */
    /* The pack and bill rows went back to their own measurements on 2026-08-19,
       when the cents field came off the struck prices and the waived lines. The
       compensation they needed — tighter gutters and gaps, a 12.5px struck
       figure, a 22px total, 6px pills — was paying for ~40px of ".00" that is no
       longer printed, and the rows fit at 375 without any of it. */
    /* 4px against the desktop's 3. This one is not about the cents: the offset
       that puts the ring on the name's centre line is how far the name is pushed
       down by baseline-aligning to the price figure, and that distance follows
       the type sizes, which differ on this tier. The plain row is untouched — it
       centres, and its own rule zeroes this. */
    .ck-pack .ring { margin-top: 4px; }

    .ck-line { align-items: flex-start; padding: 14px 0; min-height: 0; }
    .ck-line.total { min-height: 0; padding: 17px 0; }
    /* Tighter pills and gaps, and only on the phone tier. Capitalising the tags
       on 2026-08-19 widened them — "$149.75 SAVINGS" is ~7px more than the same
       figure in title case — and the total row was 4.5px short of holding one
       line at 375 in its widest state (the 6-tablet plan, discounted). Taken
